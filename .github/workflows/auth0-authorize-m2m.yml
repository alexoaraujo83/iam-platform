name: Auth0 — authorize IAM Platform M2M client

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create the client grant if it does not already exist"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auth0-m2m-api-authorization
  cancel-in-progress: false

jobs:
  authorize-m2m:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTH0_DOMAIN: iam-platform.us.auth0.com
      M2M_CLIENT_ID: jrJWPWAeDiocXjHagL1HZ9mtMi6RcmoX
      API_AUDIENCE: https://iam-platform-api
      APPLY: ${{ inputs.apply }}
      AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID }}
      AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AUTH0_MGMT_CLIENT_ID" || { echo "::error::Missing secret AUTH0_MGMT_CLIENT_ID"; exit 1; }
          test -n "$AUTH0_MGMT_CLIENT_SECRET" || { echo "::error::Missing secret AUTH0_MGMT_CLIENT_SECRET"; exit 1; }

      - name: Inspect existing grant and optionally authorize M2M
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            --request POST "https://$AUTH0_DOMAIN/oauth/token" \
            --header "content-type: application/json" \
            --data "$(jq -n \
              --arg client_id "$AUTH0_MGMT_CLIENT_ID" \
              --arg client_secret "$AUTH0_MGMT_CLIENT_SECRET" \
              --arg audience "https://$AUTH0_DOMAIN/api/v2/" \
              '{client_id:$client_id,client_secret:$client_secret,audience:$audience,grant_type:"client_credentials"}')")"
          access_token="$(printf '%s' "$token_response" | jq -er '.access_token')"
          unset token_response

          grants="$(curl --fail-with-body --silent --show-error --get \
            "https://$AUTH0_DOMAIN/api/v2/client-grants" \
            --header "authorization: Bearer $access_token" \
            --data-urlencode "client_id=$M2M_CLIENT_ID" \
            --data-urlencode "audience=$API_AUDIENCE" \
            --data-urlencode "per_page=100" \
            --data-urlencode "include_totals=true")"

          if printf '%s' "$grants" | jq -e --arg cid "$M2M_CLIENT_ID" --arg aud "$API_AUDIENCE" \
            '(.client_grants // .) | any(.[]; .client_id == $cid and .audience == $aud)' >/dev/null; then
            echo "PASS: the M2M client already has a grant for the IAM Platform API."
            exit 0
          fi

          if [ "$APPLY" != "true" ]; then
            echo "::notice::No client grant found. Dry run only; rerun manually with apply=true to create it."
            exit 0
          fi

          payload="$(jq -n --arg cid "$M2M_CLIENT_ID" --arg aud "$API_AUDIENCE" \
            '{client_id:$cid,audience:$aud,scope:[]}')"
          result="$(curl --fail-with-body --silent --show-error \
            --request POST "https://$AUTH0_DOMAIN/api/v2/client-grants" \
            --header "content-type: application/json" \
            --header "authorization: Bearer $access_token" \
            --data "$payload")"
          unset access_token grants payload
          printf '%s' "$result" | jq -e --arg cid "$M2M_CLIENT_ID" --arg aud "$API_AUDIENCE" \
            'select(.client_id == $cid and .audience == $aud) | {client_id,audience,scope}' >/dev/null
          echo "PASS: the M2M client grant was created and its client/audience verified."
