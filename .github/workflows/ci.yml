name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/iam_test
      IAM_RUNTIME_DATABASE_URL: postgres://iam_app_runtime:runtime-test-only@localhost:5432/iam_test
      IAM_DATABASE_INTEGRATION: "1"
      # Disposable values let Next.js build/import the SDK in CI; never use them in deployments.
      AUTH0_DOMAIN: example.us.auth0.com
      AUTH0_CLIENT_ID: ci-only-client-id
      AUTH0_CLIENT_SECRET: ci-only-client-secret
      AUTH0_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Install the pinned pnpm CLI directly to avoid the runner's legacy PNPM_HOME layout.
      - run: npm install --global pnpm@12.12.1
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
