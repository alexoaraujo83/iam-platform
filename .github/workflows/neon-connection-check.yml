name: Neon connection and security check

on:
  push:
    branches:
      - main
      - fix/verify-runtime-role-attributes
  workflow_dispatch:
    inputs:
      target:
        description: Neon environment to validate
        required: true
        type: choice
        options:
          - development
          - preview
          - production
        default: development

permissions:
  contents: read

concurrency:
  group: neon-check-${{ inputs.target || 'development' }}
  cancel-in-progress: false

jobs:
  verify-neon:
    name: Verify Neon ${{ inputs.target || 'development' }}
    runs-on: ubuntu-latest
    environment:
      name: neon-${{ inputs.target || 'development' }}
    timeout-minutes: 5
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate database URL is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::error::O segredo NEON_DATABASE_URL não está configurado no ambiente GitHub selecionado."
            exit 1
          fi

      - name: Run shared read-only runtime security assertions
        shell: bash
        run: |
          set -euo pipefail
          psql "$NEON_DATABASE_URL" \
            -X \
            --set=ON_ERROR_STOP=1 \
            --file=packages/database/migrations/verify_runtime_security.sql

      - name: Report audit result
        if: success()
        run: echo "Neon validado: identidade, superuser/bypassrls/createrole/createdb/replication desativados, RLS/FORCE RLS e auditoria append-only."
